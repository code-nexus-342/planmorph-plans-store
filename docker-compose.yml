version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planmorph-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - ./backend/.env
    networks:
      - planmorph-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planmorph-frontend
    restart: unless-stopped
    networks:
      - planmorph-network

  nginx:
    build: ./nginx
    container_name: planmorph-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - planmorph-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL certificates
      # - ./nginx/ssl:/etc/nginx/ssl:ro

networks:
  planmorph-network:
    driver: bridge
