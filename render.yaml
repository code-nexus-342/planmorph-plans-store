# Render.yaml - Infrastructure as Code for PlanMorph deployment
# Visit https://dashboard.render.com to deploy this project

services:
  # Backend API Service
  - type: web
    name: planmorph-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 5000
      
      - key: DATABASE_URL
        sync: false
        # Add your Neon PostgreSQL connection string in Render Dashboard
      
      - key: JWT_SECRET
        generateValue: true
        # Automatically generates a secure random value
      
      - key: JWT_EXPIRES_IN
        value: 7d
      
      - key: FRONTEND_URL
        value: https://planmorph.onrender.com
        # Update this after frontend is deployed
      
      - key: GOOGLE_CLIENT_ID
        sync: false
        # Add your Google OAuth Client ID in Render Dashboard
      
      - key: GOOGLE_CLIENT_SECRET
        sync: false
        # Add your Google OAuth Client Secret in Render Dashboard
      
      - key: GOOGLE_CALLBACK_URL
        value: https://planmorph-api.onrender.com/api/auth/google/callback
        # Update with your actual backend URL
      
      - key: EMAIL_HOST
        value: smtp.gmail.com
      
      - key: EMAIL_PORT
        value: 587
      
      - key: EMAIL_SECURE
        value: "false"
      
      - key: EMAIL_USER
        sync: false
        # Add your email in Render Dashboard
      
      - key: EMAIL_PASSWORD
        sync: false
        # Add your email app password in Render Dashboard
      
      - key: EMAIL_FROM
        value: "PlanMorph <noreply@planmorph.com>"
      
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      
      - key: MAX_FILE_SIZE
        value: 10485760
    
    healthCheckPath: /api/health
    
    autoDeploy: true
    
    # Disk storage for file uploads (optional)
    disk:
      name: planmorph-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  # Frontend Next.js Service
  - type: web
    name: planmorph-frontend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: NEXT_PUBLIC_API_URL
        value: https://planmorph-api.onrender.com/api
        # Update with your actual backend URL
      
      - key: NEXT_PUBLIC_APP_NAME
        value: PlanMorph
      
      - key: NEXT_PUBLIC_APP_URL
        value: https://planmorph.onrender.com
        # Update with your actual frontend URL
      
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
        # Add your Google OAuth Client ID in Render Dashboard
    
    healthCheckPath: /
    
    autoDeploy: true

# Database (if not using Neon - optional)
# Uncomment if you want to use Render's PostgreSQL instead of Neon
# databases:
#   - name: planmorph-db
#     databaseName: planmorph
#     user: planmorph_user
#     plan: starter
#     region: oregon
#     postgresMajorVersion: 15

# Redis Cache (optional)
# Uncomment if you want to add Redis caching
# services:
#   - type: redis
#     name: planmorph-redis
#     plan: starter
#     region: oregon
#     maxmemoryPolicy: allkeys-lru
#     ipAllowList: []
