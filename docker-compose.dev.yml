version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planmorph-backend-dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - NODE_ENV=development
    env_file:
      - ./backend/.env
    networks:
      - planmorph-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planmorph-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api
    networks:
      - planmorph-network
    command: npm run dev

  nginx:
    build: ./nginx
    container_name: planmorph-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - planmorph-network

  db:
    image: postgres:15-alpine
    container_name: planmorph-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=planmorph_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - planmorph-network

networks:
  planmorph-network:
    driver: bridge

volumes:
  postgres_data:
